<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InkNote — ghi chú bằng bút</title>
<link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="tb-left">
      <button id="btnMenu" class="ib" title="Menu" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <button id="btnUndo" class="ib" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L4 11l5 5" /><path d="M4 11h9.5a5 5 0 0 1 0 10H9" /></svg>
      </button>
      <button id="btnRedo" class="ib" title="Làm lại (Ctrl+Shift+Z)" aria-label="Làm lại">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l5 5-5 5" /><path d="M20 11H10.5a5 5 0 0 0 0 10H15" /></svg>
      </button>
      <button id="addPage" class="ib" title="Thêm trang mới">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </div>

    <div class="tb-center">
      <input id="docTitle" class="title-input" type="text" maxlength="120" spellcheck="false" aria-label="Tên ghi chú" />
      <span id="toolName" class="sr-only">Bút</span>
    </div>

    <div class="tb-right">
      <button id="btnSize" class="size-dot" title="Độ dày nét">
        <span class="size-dot-core" id="sizeDot"></span>
      </button>

      <div class="dots">
        <button class="swatch is-active" data-color="#1f2430" style="--c:#1f2430" title="Mực đen"></button>
        <button class="swatch" data-color="#2f6fed" style="--c:#2f6fed" title="Xanh dương"></button>
        <button class="swatch" data-color="#7ad3f0" style="--c:#7ad3f0" title="Xanh da trời"></button>
        <button class="swatch" data-color="#3ddc84" style="--c:#3ddc84" title="Xanh lá"></button>
        <button class="swatch" data-color="#f5d90a" style="--c:#f5d90a" title="Vàng"></button>
        <button class="swatch" data-color="#d93025" style="--c:#d93025" title="Đỏ"></button>
        <button class="swatch" data-color="#b3b9c5" style="--c:#b3b9c5" title="Xám"></button>
        <label class="swatch swatch-custom" title="Màu tuỳ chọn">
          <input type="color" id="colorInput" value="#1f2430" />
        </label>
      </div>

      <span class="vsep"></span>

      <button class="ib tool" data-tool="pen" aria-pressed="true" title="Bút (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l4.2-1.1L19 8.1a1.8 1.8 0 0 0 0-2.5l-1.6-1.6a1.8 1.8 0 0 0-2.5 0L4.6 14.3z" /><path d="M14.2 5.2l4.6 4.6" /></svg>
      </button>
      <button class="ib tool" data-tool="highlighter" aria-pressed="false" title="Dạ quang (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l9.4-9.4a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L10 20H7z" /><path d="M11 13l3 3" /><path d="M4 21h6" /></svg>
      </button>
      <button class="ib tool" data-tool="eraser" aria-pressed="false" title="Tẩy (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 20H20" /><path d="M4.8 14.6l4.6-4.6a1.6 1.6 0 0 1 2.3 0l4.4 4.4a1.6 1.6 0 0 1 0 2.3l-2.7 2.7H6.6l-1.8-1.8a1.6 1.6 0 0 1 0-2.3z" /></svg>
      </button>

      <span class="vsep"></span>
      <button id="btnPng" class="text-btn" title="Xuất trang hiện tại ra PNG">PNG</button>
      <button id="btnPdf" class="text-btn" title="Xuất toàn bộ trang ra PDF">PDF</button>
    </div>

    <div class="popover menu" id="menuPop" role="menu" hidden>
      <button id="btnNewDoc" role="menuitem">Ghi chú mới</button>
      <button id="btnImportJson" role="menuitem">Nhập tệp .json…</button>
      <button id="btnExportJson" role="menuitem">Xuất tệp .json</button>
      <span class="pop-sep"></span>
      <button id="dupPage" role="menuitem">Nhân bản trang</button>
      <button id="delPage" role="menuitem">Xoá trang</button>
      <button id="clearPage" role="menuitem">Xoá hết nét trên trang</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden />
    </div>

    <div class="popover" id="sizePop" role="dialog" hidden>
      <div class="pop-title">Độ dày nét</div>
      <input type="range" id="sizeSlider" min="1" max="24" step="0.5" value="3" aria-label="Độ dày nét" />
      <div class="size-value"><span id="sizeLabel">3</span> px</div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="page-wrap" id="pageWrap">
      <canvas id="baseCanvas"></canvas>
      <canvas id="liveCanvas"></canvas>
    </div>
  </main>

  <footer class="statusbar">
    <div class="sb-group">
      <button id="prevPage" class="ib sm" title="Trang trước (←)" aria-label="Trang trước">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6" /></svg>
      </button>
      <span class="page-label" id="pageLabel">1 / 1</span>
      <button id="nextPage" class="ib sm" title="Trang sau (→)" aria-label="Trang sau">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6" /></svg>
      </button>
    </div>

    <span class="vsep"></span>

    <div class="sb-group">
      <button class="bg-btn" data-bg="blank" title="Trang trắng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="3.5" width="15" height="17" rx="2" /></svg>
      </button>
      <button class="bg-btn" data-bg="lined" title="Giấy kẻ dòng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="3.5" width="15" height="17" rx="2" /><path d="M7.5 9h9M7.5 12.5h9M7.5 16h9" /></svg>
      </button>
      <button class="bg-btn" data-bg="grid" title="Giấy kẻ ô">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="3.5" width="15" height="17" rx="2" /><path d="M9.5 3.5v17M14.5 3.5v17M4.5 9h15M4.5 15h15" /></svg>
      </button>
      <button class="bg-btn" data-bg="dotted" title="Giấy chấm">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4.5" y="3.5" width="15" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" /><circle cx="8.5" cy="8" r="1" /><circle cx="12" cy="8" r="1" /><circle cx="15.5" cy="8" r="1" /><circle cx="8.5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="15.5" cy="12" r="1" /><circle cx="8.5" cy="16" r="1" /><circle cx="12" cy="16" r="1" /><circle cx="15.5" cy="16" r="1" /></svg>
      </button>
    </div>

    <div class="sb-right">
      <div class="sb-group">
        <button id="zoomOut" class="ib sm" title="Thu nhỏ (−)" aria-label="Thu nhỏ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14" /></svg>
        </button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button id="zoomIn" class="ib sm" title="Phóng to (+)" aria-label="Phóng to">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="zoomFit" class="text-btn" title="Vừa chiều rộng">Vừa</button>
      </div>
    </div>
  </footer>
</div>

<noscript>Ứng dụng cần JavaScript để vẽ. Hãy bật JavaScript rồi tải lại trang.</noscript>

<script src="js/model.js?v=3"></script>
<script src="js/storage.js?v=3"></script>
<script src="js/render.js?v=3"></script>
<script src="js/export.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
