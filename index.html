<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InkNote — ghi chú bằng bút</title>
<link rel="stylesheet" href="css/styles.css?v=5" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="tb-left">
      <button id="btnMenu" class="ib" title="Menu" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>

      <button id="btnPages" class="page-chip" title="Danh sách trang" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3.5h7.5L18 8v12.5H6z" /><path d="M13.5 3.5V8H18" /></svg>
        <span id="pageChip">1</span>
      </button>

      <button id="btnUndo" class="ib" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L4 11l5 5" /><path d="M4 11h9.5a5 5 0 0 1 0 10H9" /></svg>
      </button>
      <button id="btnRedo" class="ib" title="Làm lại (Ctrl+Shift+Z)" aria-label="Làm lại">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l5 5-5 5" /><path d="M20 11H10.5a5 5 0 0 0 0 10H15" /></svg>
      </button>
      <button id="addPage" class="ib" title="Thêm trang mới">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13 3.5H6.5A1.5 1.5 0 0 0 5 5v14a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V9.5" /><path d="M13 3.5V9.5h6" /><path d="M15.5 2v5M13 4.5h5" /></svg>
      </button>
      <button id="btnGrid" class="ib" title="Xem tất cả trang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="6.4" height="6.4" rx="1" /><rect x="13.6" y="4" width="6.4" height="6.4" rx="1" /><rect x="4" y="13.6" width="6.4" height="6.4" rx="1" /><rect x="13.6" y="13.6" width="6.4" height="6.4" rx="1" /></svg>
      </button>
    </div>

    <div class="tb-center">
      <input id="docTitle" class="title-input" type="text" maxlength="120" spellcheck="false" aria-label="Tên ghi chú" />
      <span id="titleCount" class="title-count">(1)</span>
    </div>

    <div class="tb-right">
      <div class="dots">
        <button class="swatch is-active" data-color="#111111" style="--c:#111111" title="Đen"></button>
        <button class="swatch" data-color="#e53935" style="--c:#e53935" title="Đỏ"></button>
        <button class="swatch" data-color="#f5a623" style="--c:#f5a623" title="Cam"></button>
        <button class="swatch" data-color="#2ecc55" style="--c:#2ecc55" title="Xanh lá"></button>
        <button class="swatch" data-color="#22c3d6" style="--c:#22c3d6" title="Xanh ngọc"></button>
        <button class="swatch" data-color="#2f6fed" style="--c:#2f6fed" title="Xanh dương"></button>
        <button class="swatch" data-color="#8b5cf6" style="--c:#8b5cf6" title="Tím"></button>
        <label class="swatch swatch-custom" title="Màu tuỳ chọn">
          <input type="color" id="colorInput" value="#111111" />
        </label>
      </div>

      <div class="pips" id="sizePips" title="Độ dày nét">
        <button class="pip" data-pip="0" aria-label="Nét mảnh"><span></span></button>
        <button class="pip" data-pip="1" aria-label="Nét vừa"><span></span></button>
        <button class="pip" data-pip="2" aria-label="Nét đậm"><span></span></button>
      </div>

      <button class="ib tool" data-tool="pen" aria-pressed="true" title="Bút (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 19.4l4.1-1.1L18.9 8.1a1.9 1.9 0 0 0 0-2.7l-1.3-1.3a1.9 1.9 0 0 0-2.7 0L4.7 14.3z" /><path d="M14 5.4l4.6 4.6" /></svg>
      </button>
      <button class="ib tool" data-tool="highlighter" aria-pressed="false" title="Dạ quang (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.8l9.5-9.5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L10.6 19H7z" /><path d="M11.2 12.6l3.2 3.2" /><path d="M5 21h7" /></svg>
      </button>
      <button class="ib tool" data-tool="eraser" aria-pressed="false" title="Tẩy (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2.6 2.2"><path d="M9 19.5h10.5" /><path d="M4.6 14.2l5-5a1.7 1.7 0 0 1 2.4 0l3.8 3.8a1.7 1.7 0 0 1 0 2.4l-3 3H6.4l-1.8-1.8a1.7 1.7 0 0 1 0-2.4z" /></svg>
      </button>
      <button id="btnSettings" class="ib" title="Cài đặt" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7.5h10M18 7.5h2" /><circle cx="16" cy="7.5" r="2" /><path d="M4 16.5h5M13 16.5h7" /><circle cx="11" cy="16.5" r="2" /></svg>
      </button>
    </div>

    <div class="popover left" id="menuPop" role="menu" hidden>
      <button id="btnNewDoc" role="menuitem">Ghi chú mới</button>
      <button id="btnImportJson" role="menuitem">Nhập tệp .json…</button>
      <button id="btnExportJson" role="menuitem">Xuất tệp .json</button>
      <span class="pop-sep"></span>
      <button id="dupPage" role="menuitem">Nhân bản trang</button>
      <button id="delPage" role="menuitem">Xoá trang</button>
      <button id="clearPage" role="menuitem">Xoá hết nét trên trang</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden />
    </div>

    <div class="popover left pages" id="pagesPop" role="dialog" hidden>
      <div class="pop-title">Trang</div>
      <div class="page-grid" id="pagesGrid"></div>
      <div class="pop-actions">
        <button id="pAdd" class="text-btn">Thêm</button>
        <button id="pDup" class="text-btn">Nhân bản</button>
        <button id="pDel" class="text-btn">Xoá</button>
      </div>
    </div>

    <div class="popover right" id="setPop" role="dialog" hidden>
      <div class="pop-title">Kiểu giấy</div>
      <div class="bg-row">
        <button class="bg-btn" data-bg="blank" title="Trang trắng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="3.5" width="15" height="17" rx="2" /></svg>
          <span>Trắng</span>
        </button>
        <button class="bg-btn" data-bg="lined" title="Giấy kẻ dòng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="3.5" width="15" height="17" rx="2" /><path d="M7.5 9h9M7.5 12.5h9M7.5 16h9" /></svg>
          <span>Dòng</span>
        </button>
        <button class="bg-btn" data-bg="grid" title="Giấy kẻ ô">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="3.5" width="15" height="17" rx="2" /><path d="M9.5 3.5v17M14.5 3.5v17M4.5 9h15M4.5 15h15" /></svg>
          <span>Ô</span>
        </button>
        <button class="bg-btn" data-bg="dotted" title="Giấy chấm">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4.5" y="3.5" width="15" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" /><circle cx="8.5" cy="8" r="1" /><circle cx="12" cy="8" r="1" /><circle cx="15.5" cy="8" r="1" /><circle cx="8.5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="15.5" cy="12" r="1" /><circle cx="8.5" cy="16" r="1" /><circle cx="12" cy="16" r="1" /><circle cx="15.5" cy="16" r="1" /></svg>
          <span>Chấm</span>
        </button>
      </div>

      <span class="pop-sep"></span>

      <div class="pop-title">Độ dày nét</div>
      <input type="range" id="sizeSlider" min="1" max="24" step="0.5" value="3" aria-label="Độ dày nét" />
      <div class="size-value"><span id="sizeLabel">3</span> px</div>

      <span class="pop-sep"></span>

      <div class="pop-title">Thu phóng</div>
      <div class="zoom-row">
        <button id="zoomOut" class="ib sm" title="Thu nhỏ (−)" aria-label="Thu nhỏ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14" /></svg>
        </button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button id="zoomIn" class="ib sm" title="Phóng to (+)" aria-label="Phóng to">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="zoomFit" class="text-btn" title="Vừa chiều rộng">Vừa</button>
      </div>

      <span class="pop-sep"></span>

      <div class="export-row">
        <button id="btnPng" class="text-btn wide" title="Xuất trang hiện tại ra PNG">Xuất PNG</button>
        <button id="btnPdf" class="text-btn wide" title="Xuất toàn bộ trang ra PDF">Xuất PDF</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="page-wrap" id="pageWrap">
      <canvas id="baseCanvas"></canvas>
      <canvas id="liveCanvas"></canvas>
    </div>
  </main>

  <div class="margin-band" id="marginBand" aria-hidden="true"></div>

  <button id="prevPage" class="page-arrow left" title="Trang trước (←)" aria-label="Trang trước">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16 4.2v15.6L5.4 12z" /></svg>
  </button>
  <button id="nextPage" class="page-arrow right" title="Trang sau (→)" aria-label="Trang sau">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 4.2v15.6L18.6 12z" /></svg>
  </button>
</div>

<noscript>Ứng dụng cần JavaScript để vẽ. Hãy bật JavaScript rồi tải lại trang.</noscript>

<script src="js/model.js?v=5"></script>
<script src="js/storage.js?v=5"></script>
<script src="js/render.js?v=5"></script>
<script src="js/export.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
